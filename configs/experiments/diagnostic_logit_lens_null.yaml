experiment:
  name: diagnostic_logit_lens_null
  description: |
    Diagnostic companion to the final config. Captures the same gated-key
    trajectory as final_qwen_truthfulqa but turns ON the two exploratory
    diagnostics that are NOT part of the headline 4-feature probe:

      - logit-lens entropy + top-1 prob   (output-distribution uncertainty,
                                            orthogonal to retrieval concentration;
                                            +1 forward pass per sample)
      - shuffled-bank null control        (controls "any bank gives this Δ";
                                            +1 forward pass per sample)
      - top-K compressed scores           (top-256 + tail-max, ~95% less disk
                                            than full [L, T, K])

    Purpose: measure whether either diagnostic carries hallucination signal
    that ΔE / JS / Hellinger do not. Reported as ablations, never folded into
    the headline probe. See docs/findings.md.

model:
  alias: qwen25_3b
  load_in_4bit: true

dataset:
  name: truthfulqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up                    # legacy field; primary_probe wins below
  beta: 15.0                  # starting point; overridden by calibration
  calibrate_beta: true
  calibration_samples: 30
  beta_target: 0.55
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0

  # Storage: top-256 + tail-max instead of full [L, T, K] saves ~95% disk.
  scores_subset_size: 200
  score_capture: topk
  score_topk: 256

  # Exploratory diagnostics (off in the final config; on here)
  enable_logit_lens: true
  enable_null_control: true

primary_probe:
  bank: gated_key
  normalize: true
  hook_target: mlp_input
  normalize_query: false      # match the final headline config
  label: gated_key

analysis:
  score_metric: delta_logit_entropy
  score_aggregation: mean
  signal_zone: null
  pool_over_answer: true

sharding:
  num_shards: 1

output:
  base_dir: outputs
