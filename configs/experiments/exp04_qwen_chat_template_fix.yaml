experiment:
  name: exp04_qwen_chat_template_fix
  description: |
    Corrected Qwen2.5-3B baseline on 500 TruthfulQA samples. Both prefill and generation
    observe the same chat-templated prompt. Beta is auto-calibrated so norm_entropy sits
    in the detectable regime (target 0.55 × log K) rather than collapsed or flat.

model:
  alias: qwen25_3b
  load_in_4bit: true

dataset:
  name: truthfulqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up
  beta: 15.0                  # starting point; overridden by calibration below
  calibrate_beta: true
  calibration_samples: 30
  beta_target: 0.55
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0
  scores_subset_size: 50

analysis:
  score_metric: delta_energy
  score_aggregation: mean
  signal_zone: null

sharding:
  num_shards: 1

output:
  base_dir: outputs   # override at submit time
