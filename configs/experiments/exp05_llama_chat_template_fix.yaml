experiment:
  name: exp05_llama_chat_template_fix
  description: |
    Replication of exp03 (Llama 3.2-3B, 500 TruthfulQA) AFTER the prefill chat-template fix.
    Comparable to exp04 (same dataset, beta, seed); two-model contrast under correct prompts.

model:
  alias: llama32_3b
  load_in_4bit: true

dataset:
  name: truthfulqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up
  beta: 15.0
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0
  scores_subset_size: 50

analysis:
  score_metric: delta_energy
  score_aggregation: mean
  signal_zone: null

sharding:
  num_shards: 1

output:
  base_dir: outputs
