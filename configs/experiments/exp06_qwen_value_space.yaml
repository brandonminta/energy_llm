experiment:
  name: exp06_qwen_value_space
  description: |
    Paired key-space (W_up rows) + value-space (W_down.T rows) probe on Qwen2.5-3B.
    Geva et al. 2021 argue MLP value vectors carry semantic content; this is the
    principled comparison against the key-space-only baseline. Both probes share
    the same generation pass via teacher forcing — minimal extra GPU cost.

model:
  alias: qwen25_3b
  load_in_4bit: true

dataset:
  name: truthfulqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up                    # legacy field, primary_probe wins below
  beta: 15.0                  # starting point; overridden by calibration
  calibrate_beta: true
  calibration_samples: 30
  beta_target: 0.55
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0
  scores_subset_size: 50

primary_probe:
  bank: up
  normalize: true
  hook_target: mlp_input
  normalize_query: true
  label: key_space

secondary_probe:
  bank: down_values
  normalize: true
  hook_target: mlp_output
  normalize_query: true
  label: value_space

analysis:
  score_metric: delta_energy
  score_aggregation: mean
  signal_zone: null

sharding:
  num_shards: 1

output:
  base_dir: outputs
