experiment:
  name: exp07_qwen_layer_scan
  description: |
    Identical capture to exp04, but analysis runs the score over a narrow layer slice.
    Run analyze multiple times with different signal_zone overrides (or just inspect
    the layer_metrics in analysis.json) to find where signal concentrates if anywhere.
    No new GPU work — reuse exp04 trajectories with --skip-banks and a different output dir.

model:
  alias: qwen25_3b
  load_in_4bit: true

dataset:
  name: truthfulqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up
  beta: 15.0
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0
  scores_subset_size: 0       # disabled — focus is on signal_zone, not beta sweep

analysis:
  score_metric: delta_energy
  score_aggregation: mean
  signal_zone: [10, 20]       # mid-block layers; rerun with [0,10] and [20,36] to scan

sharding:
  num_shards: 1

output:
  base_dir: outputs
