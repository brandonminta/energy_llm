experiment:
  name: exp07b_qwen_gated_key
  description: |
    Gated key-space probe on Qwen2.5-3B — C1 from the publication checklist.

    Bank rows = W_gate[k] ⊙ W_up[k]  (element-wise product, normalised).
    This is the principled SwiGLU key for Modern Hopfield retrieval: the
    k-th MLP hidden activation is a_k ≈ ξ_k^gated · x.

    Compare AUROC against exp04b (plain W_up bank, normalize_query=false).
    If gated_key > W_up, the full gating signal is needed for discrimination.
    If similar, the W_up approximation captures the relevant structure.

model:
  alias: qwen25_3b
  load_in_4bit: true

dataset:
  name: truthfulqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up                    # legacy field; primary_probe wins below
  beta: 15.0
  calibrate_beta: true
  calibration_samples: 30
  beta_target: 0.55
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0
  scores_subset_size: 50

primary_probe:
  bank: gated_key
  normalize: true
  hook_target: mlp_input
  normalize_query: false      # consistent with exp04b for fair comparison
  label: gated_key

analysis:
  score_metric: delta_energy
  score_aggregation: mean
  signal_zone: null

sharding:
  num_shards: 1

output:
  base_dir: outputs
