experiment:
  name: final_llama_triviaqa
  description: |
    Cross-dataset + cross-architecture transfer (Llama-3.2-3B, TriviaQA
    rc.nocontext). Completes the 2×2 model×dataset matrix of the final
    campaign. Same probe and energy settings as the other final_* configs.
    500 samples at fixed seed.

model:
  alias: llama32_3b
  load_in_4bit: true

dataset:
  name: triviaqa
  max_samples: 500
  seed: 42

trajectory:
  bank: up
  beta: 15.0
  calibrate_beta: true
  calibration_samples: 30
  beta_target: 0.55
  threshold: 0.1
  energy_mode: dot
  max_new_tokens: 50
  diagnostic_subset: 0
  scores_subset_size: 50

primary_probe:
  bank: gated_key
  normalize: true
  hook_target: mlp_input
  normalize_query: false
  label: gated_key

analysis:
  score_metric: delta_energy
  score_aggregation: mean
  signal_zone: null
  pool_over_answer: true

sharding:
  num_shards: 1

output:
  base_dir: outputs
