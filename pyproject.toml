[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopfield_llm"
version = "0.2.0"
description = "Energy-based hallucination detection for LLMs using Modern Hopfield networks."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
  { name = "hopfield_llm contributors" },
]
keywords = [
  "llm",
  "mechanistic-interpretability",
  "hallucination-detection",
  "hopfield",
]

[project.scripts]
hopfield-llm = "hopfield_llm.cli.run:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
