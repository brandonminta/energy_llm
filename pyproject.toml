[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_llm"
version = "2.0.0"
description = "Extraction of Modern Hopfield retrieval metrics from the SwiGLU gate of LLMs."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [{ name = "Brandon Minta" }]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "scipy==1.17.0"]

[project.scripts]
energy-llm = "energy_llm.cli:main"

[tool.setuptools]
packages = ["energy_llm"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
