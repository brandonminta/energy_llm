[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy_llm"
version = "1.0.0"
description = "Hallucination detection in LLMs via Modern Hopfield retrieval over SwiGLU memory banks (thesis pipeline)."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
  { name = "Brandon Minta" },
]
keywords = [
  "llm",
  "mechanistic-interpretability",
  "hallucination-detection",
  "hopfield",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["energy_llm"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
